# 앱 이름
spring.application.name=england-camping

# 포트 (8044: 8080대 + 44=영국 국가번호 → 잉글랜드 캠핑장)
server.port=8044

# ===== DB 연결 (MySQL) =====
# serverTimezone: 시간이 한국 시간으로 저장되게
# allowPublicKeyRetrieval, useSSL: DBeaver에서 났던 연결 오류를 Spring에서도 막기 위함 (내 PC 전용 설정)
spring.datasource.url=jdbc:mysql://localhost:3306/england_camping?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=camping
# 비밀번호는 코드에 쓰지 않고 Windows 환경 변수에서 읽음
spring.datasource.password=${ENGLAND_CAMPING_DB_PASSWORD}

# ===== JPA =====
# update: 엔티티를 보고 테이블을 자동으로 만들거나 고쳐 줌 (개발용)
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL을 콘솔에 보기 좋게 출력 (확인용)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 화면을 그리는 동안 DB 연결을 붙잡아 두지 않음 (권장 설정, 시작할 때 뜨던 경고도 사라짐)
# 화면에서 쓰는 연결 데이터(싸이트의 종류, 자리의 사진)는 서비스에서 미리 함께 불러옴
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
# 개발 중에는 HTML을 고치면 재시작 없이 바로 보이게 캐시 끔
spring.thymeleaf.cache=false

# ===== 카카오맵 =====
# JavaScript 키. 화면에 공개되는 키라 비밀번호만큼 위험하진 않지만,
# GitHub에 올리지 않으려고 환경 변수(KAKAO_MAP_JS_KEY)에서 읽음.
# 환경 변수가 없으면 빈 값 → 오시는 길 페이지에 "지도 준비 중" 표시
kakao.map.js-key=${KAKAO_MAP_JS_KEY:}

# ===== AI 챗봇 (Google Gemini, 무료 등급) =====
# API 키는 코드·GitHub에 쓰지 않고 환경 변수(GEMINI_API_KEY)에서 읽음. 없으면 빈 값 → 챗봇이 "준비 중"으로 동작
gemini.api-key=${GEMINI_API_KEY:}
# 쓸 모델 ID. 무료 등급 하루 한도가 넉넉한 Flash Lite (AI Studio > 비율 제한에서 확인: 하루 500번)
gemini.model=gemini-3.5-flash-lite

# 챗봇 안전장치
# 전체 하루 질문 수 = 구글 무료 한도 (AI Studio > 비율 제한 > Gemini 3.5 Flash Lite 의 RPD). 다 차면 그날은 "전화 문의" 안내
# "하루"는 구글 기준(미국 서부 자정) = 한국 시간 오후 5시(겨울)/오후 4시(여름)에 새로 시작
chatbot.daily-total-limit=500
# 한 사람(접속 주소)당 하루 질문 수 / 질문 한 번 최대 글자 수 / 기억할 앞 대화 수(질문+답 합쳐서)
chatbot.daily-limit-per-user=20
chatbot.max-message-length=500
chatbot.history-size=6

# ===== 관리자 =====
# 처음 실행할 때 관리자 계정이 없으면 이 값으로 만든다 (비밀번호는 환경 변수에만, 채팅/코드에 쓰지 않기)
# 계정이 만들어진 뒤에는 환경 변수를 바꿔도 반영되지 않음 → 비밀번호 변경 화면 사용
admin.initial-username=${ENGLAND_CAMPING_ADMIN_USERNAME:admin}
admin.initial-password=${ENGLAND_CAMPING_ADMIN_PASSWORD:}
# 로그인 유지(2주) 쿠키에 서명할 때 쓰는 비밀 문자열. 비어 있으면 실행할 때마다 새로 만듦 (재시작하면 자동 로그인이 풀림)
admin.remember-me-key=${ENGLAND_CAMPING_REMEMBER_KEY:}


# ===== 사진 =====
# 저장 폴더 (프로젝트 밖 → GitHub에 안 올라가고, 다시 빌드해도 안 지워짐)
# 환경 변수가 없으면 내 PC 사용자 폴더 아래 england-camping-uploads (서버에서는 환경 변수로 지정)
app.upload-dir=${ENGLAND_CAMPING_UPLOAD_DIR:${user.home}/england-camping-uploads}
# 올리기 크기 제한: 한 장 20MB, 한 번에 200MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
# 한 번에 여러 장 올릴 수 있게 (톰캣 기본값은 몇 장 안 됨)
server.tomcat.max-part-count=100
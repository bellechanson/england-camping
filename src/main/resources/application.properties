# 앱 이름
spring.application.name=england-camping

# 포트 (8044: 8080대 + 44=영국 국가번호 → 잉글랜드 캠핑장)
server.port=8044

# ===== DB 연결 (MySQL) =====
# serverTimezone: 시간이 한국 시간으로 저장되게
# allowPublicKeyRetrieval, useSSL: DBeaver에서 났던 연결 오류를 Spring에서도 막기 위함 (내 PC 전용 설정)
spring.datasource.url=jdbc:mysql://localhost:3306/england_camping?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=camping
# 비밀번호는 코드에 쓰지 않고 Windows 환경 변수에서 읽음
spring.datasource.password=${ENGLAND_CAMPING_DB_PASSWORD}

# ===== JPA =====
# update: 엔티티를 보고 테이블을 자동으로 만들거나 고쳐 줌 (개발용)
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL을 콘솔에 보기 좋게 출력 (확인용)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Thymeleaf =====
# 개발 중에는 HTML을 고치면 재시작 없이 바로 보이게 캐시 끔
spring.thymeleaf.cache=false
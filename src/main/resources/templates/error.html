<!DOCTYPE html>
<html lang="ko" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<!--
  모든 오류 화면 (404 없는 페이지, 403 막힌 페이지, 500 서버 문제 등)
  - 스프링이 오류가 나면 자동으로 이 파일을 씀 (하얀 Whitelabel 화면 대신)
  - DB가 멈춘 상황에서도 보여야 해서 settings 같은 DB 값을 쓰지 않음
  - 오류 내용(코드 내부)은 손님에게 보여 주지 않고, 콘솔 로그에만 남음
  - status : 스프링이 넣어 주는 오류 번호
-->

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title th:text="${status == 404} ? '페이지를 찾을 수 없습니다 | 잉글랜드 캠핑장' : '잠시 문제가 생겼습니다 | 잉글랜드 캠핑장'">잉글랜드 캠핑장</title>
	<!-- 파비콘 (브라우저 탭 아이콘) + 폰 홈 화면 아이콘. 파일은 static 폴더 맨 위 -->
	<link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
	<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
	<link rel="icon" type="image/png" sizes="192x192" th:href="@{/icon-192.png}">
	<link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">
	<link rel="stylesheet" th:href="@{/assets/vendor/bootstrap6/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/assets/css/base.css}">
	<link rel="stylesheet" th:href="@{/assets/css/style.css}">
	<link rel="stylesheet" th:href="@{/assets/css/england.css}">
</head>

<body>
	<main class="error-page" th:with="notFound=${status == 404}, forbidden=${status == 403}">
		<div class="container" style="max-width:40rem">

			<a class="wordmark fg-1 d-inline-block mb-7" th:href="@{/}">잉글랜드 캠핑장</a>

			<p class="eyebrow fs-sm fg-primary mb-3" th:text="${status}">404</p>

			<!-- 404: 없는 주소 -->
			<th:block th:if="${notFound}">
				<h1 class="section-title fs-4xl mb-4">페이지를 찾을 수 없습니다</h1>
				<p class="fg-2 mb-6">주소가 바뀌었거나 삭제된 페이지입니다. 주소를 다시 확인해 주세요.</p>
			</th:block>

			<!-- 403: 막힌 페이지 (관리자 화면을 오래 열어 두었다가 저장할 때도 생길 수 있음) -->
			<th:block th:if="${forbidden}">
				<h1 class="section-title fs-4xl mb-4">들어갈 수 없는 페이지입니다</h1>
				<p class="fg-2 mb-6">화면을 오래 열어 두었다면 새로고침한 뒤 다시 시도해 주세요.</p>
			</th:block>

			<!-- 그 외 (500 등 서버 문제) -->
			<th:block th:unless="${notFound or forbidden}">
				<h1 class="section-title fs-4xl mb-4">잠시 문제가 생겼습니다</h1>
				<p class="fg-2 mb-6">잠시 후 다시 시도해 주세요. 계속 같은 화면이 나오면 전화로 문의해 주세요.</p>
			</th:block>

			<div class="d-flex flex-wrap gap-3">
				<a class="btn-solid theme-primary" th:href="@{/}">홈으로</a>
				<a class="btn-outline theme-secondary" th:href="@{/location}">연락처 · 오시는 길</a>
			</div>
		</div>
	</main>
</body>

</html>

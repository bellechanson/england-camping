<!DOCTYPE html>
<html lang="ko" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin :: head('사이트 관리')}"></head>

<body>

	<header th:replace="~{fragments/admin :: header}"></header>

	<main class="admin-main">
		<div class="container">
			<div th:replace="~{fragments/admin :: flash}"></div>

			<section class="admin-card">
				<form th:action="@{/admin/sites}" th:object="${form}" method="post" novalidate>

					<!-- 저장 버튼은 맨 아래 하나만 (타일 바꾸고 → 메모 쓰고 → 저장) -->
					<h1 class="fs-xl fw-semibold mb-2" th:text="'사이트 관리 (' + ${#lists.size(form.rows)} + '개)'">사이트
						관리</h1>
					<p class="fs-sm fg-3 mb-3">
						사이트를 누르면 "이용 가능 ↔ 이용 불가"가 바뀝니다. 이용 불가 사이트는 홈페이지 배치도에 점선으로 보입니다.
						바꾼 뒤 "전체 저장"을 눌러 주세요.
					</p>
					<!-- 요약 (아래 스크립트가 누를 때마다 다시 셈) -->
					<p class="site-summary" id="siteSummary" aria-live="polite"
						th:text="'이용 가능 ' + ${#lists.size(form.rows.?[available])} + ' · 이용 불가 ' + ${#lists.size(form.rows.?[!available])}">
						이용 가능 19 · 이용 불가 3</p>

					<!-- ===== 위치별 타일 (묶음은 CampSiteForm.getGroups) =====
					     타일 하나 = label 안에 숨은 체크박스 → 타일을 누르면 체크가 바뀜
					     켜짐/꺼짐 모양은 CSS(:has)로, 스크립트 없이도 동작 -->
					<section class="site-area" th:each="g : *{groups}">
						<h2 class="site-area-title"><span th:text="${g.label}">도로 근처</span><span class="fs-sm fg-3"
								th:text="${#lists.size(g.indexes)} + '개'">5개</span></h2>
						<div class="site-tiles">
							<label class="site-tile" th:each="i : ${g.indexes}" th:with="row=${form.rows[i]}"
								th:for="${'available-' + i}">
								<!-- 저장할 때 어느 사이트인지 (이름·종류는 오류 때 다시 보여 주기용) -->
								<input type="hidden" th:name="|rows[${i}].id|" th:value="${row.id}">
								<input type="hidden" th:name="|rows[${i}].name|" th:value="${row.name}">
								<input type="hidden" th:name="|rows[${i}].typeName|" th:value="${row.typeName}">
								<!-- 이용 가능 체크 (눈에는 안 보이고 타일 전체가 버튼 역할) -->
								<input type="checkbox" class="site-tile-check" value="true" th:id="${'available-' + i}"
									th:name="|rows[${i}].available|" th:checked="${row.available}"
									th:attr="data-index=${i}">
								<!-- 체크를 끄면 체크박스 값이 아예 안 보내짐 → 이 숨은 칸(_로 시작)이 있으면 Spring이 false로 넣어 줌 -->
								<input type="hidden" th:name="|_rows[${i}].available|" value="on">

								<span class="site-tile-name" th:text="${row.shortName}">01</span>
								<span class="site-tile-state is-on">이용 가능</span>
								<span class="site-tile-state is-off">이용 불가</span>
								<!-- 메모가 있으면 오른쪽 위 작은 주황 점 -->
								<span class="site-tile-memo" th:if="${!#strings.isEmpty(row.note)}" title="메모 있음">메모
									있음</span>
							</label>
						</div>
					</section>

					<!-- ===== 메모 (관리자만 봄) =====
					     22개 칸이 전부 폼 안에 있음 (숨겨도 같이 저장돼서 다른 메모가 지워지지 않음)
					     처음엔 "이용 불가이거나 메모가 있는" 사이트만 보이고, 타일을 끄면 그 칸이 나타남 -->
					<section class="site-memos">
						<!-- 제목 줄: 왼쪽 "메모" / 오른쪽 펼치기·접기 버튼 (펼쳐도 버튼 위치가 안 바뀜) -->
						<div class="site-memos-head">
							<h2 class="site-area-title mb-0">메모<span class="fs-sm fg-3">관리자만 봅니다 · 이용 불가이거나 메모가
									있는 사이트만 보여요</span></h2>
							<button type="button" class="btn-outline theme-secondary btn-sm pill-neutral"
								id="showAllMemos" aria-expanded="false" aria-controls="siteMemoList">전체 메모 펼치기
								▾</button>
						</div>

						<!-- 22개 칸이 전부 폼 안에 있음 (숨겨도 같이 저장돼서 다른 메모가 지워지지 않음)
						 	     PC는 2열, 폰은 1열 -->
						<div class="site-memo-list" id="siteMemoList">
							<div class="site-memo-row" th:each="row, stat : *{rows}" th:attr="data-index=${stat.index}"
								th:hidden="${row.available and #strings.isEmpty(row.note) and !#fields.hasErrors('rows[__${stat.index}__].note')}">
								<label class="site-memo-name" th:for="${'note-' + stat.index}"
									th:text="${row.shortName}">08</label>
								<input type="text" class="form-control" maxlength="200" th:id="${'note-' + stat.index}"
									th:name="|rows[${stat.index}].note|" th:value="${row.note}"
									placeholder="예) 장박 이용 중 (2027년 3월까지)">
								<p class="field-error" th:if="${#fields.hasErrors('rows[__${stat.index}__].note')}"
									th:errors="*{rows[__${stat.index}__].note}">오류</p>
							</div>
						</div>
					</section>

					<div class="d-flex justify-content-end mt-5">
						<button type="submit" class="btn-solid theme-primary">전체 저장</button>
					</div>
				</form>
			</section>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

	<!-- ===== 사이트 관리: 요약 숫자 + 꺼진 사이트 메모 칸 보이기 =====
	     (켜짐/꺼짐 모양은 CSS가 처리, 여기서는 숫자와 메모 칸만) -->
	<script>
		(() => {
			const checks = document.querySelectorAll('.site-tile-check');
			const summary = document.getElementById('siteSummary');
			const showAll = document.getElementById('showAllMemos');
			const memoRow = (index) => document.querySelector('.site-memo-row[data-index="' + index + '"]');
			let showingAll = false;

			function refresh() {
				let on = 0;
				checks.forEach((check) => {
					if (check.checked) {
						on++;
					}
					const row = memoRow(check.dataset.index);
					if (!row || showingAll) {
						return;
					}
					const input = row.querySelector('input');
					// 꺼진 사이트 or 메모가 있는 사이트 → 보임, 켜져 있고 메모가 비었으면 숨김
					row.hidden = check.checked && input.value.trim() === '';
				});
				summary.textContent = '이용 가능 ' + on + ' · 이용 불가 ' + (checks.length - on);
			}

			checks.forEach((check) => check.addEventListener('change', refresh));

			// "전체 메모 펼치기" ↔ "접기"
			// 펼치면 22칸 전부, 접으면 처음처럼 (이용 불가이거나 메모를 쓴 사이트만 남음)
			showAll.addEventListener('click', () => {
				showingAll = !showingAll;
				if (showingAll) {
					document.querySelectorAll('.site-memo-row').forEach((row) => {
						row.hidden = false;
					});
				}
				showAll.textContent = showingAll ? '접기 ▴' : '전체 메모 펼치기 ▾';
				showAll.setAttribute('aria-expanded', String(showingAll));
				refresh(); // 접을 때: 켜져 있고 메모가 빈 칸은 다시 숨김
			});

			refresh();
		})();
	</script>
</body>

</html>

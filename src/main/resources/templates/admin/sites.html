<!DOCTYPE html>
<html lang="ko" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin :: head('싸이트 관리')}"></head>

<body>

	<header th:replace="~{fragments/admin :: header}"></header>

	<main class="admin-main">
		<div class="container">
			<div th:replace="~{fragments/admin :: flash}"></div>

			<section class="admin-card">
				<form th:action="@{/admin/sites}" th:object="${form}" method="post" novalidate>

					<div class="d-flex flex-wrap justify-content-between align-items-center gap-4 mb-2">
						<h1 class="fs-xl fw-semibold mb-0" th:text="'싸이트 관리 (' + ${#lists.size(form.rows)} + '개)'">싸이트
							관리</h1>
						<button type="submit" class="btn-solid theme-primary">전체 저장</button>
					</div>
					<p class="fs-sm fg-3 mb-5">
						"이용 가능"을 끄면 홈페이지 싸이트 목록에서 흐리게 "현재 이용 불가"로 보입니다.
						메모는 관리자만 보고 손님에게는 보이지 않습니다. 바꾼 뒤 "전체 저장"을 눌러 주세요.
					</p>

					<table class="admin-table">
						<thead>
							<tr>
								<th style="width:9rem">싸이트</th>
								<th style="width:9rem">종류</th>
								<th style="width:9rem">이용</th>
								<th>메모 (관리자만 봄)</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="row, stat : *{rows}" th:classappend="${row.available} ? '' : 'is-closed'">
								<td>
									<!-- 저장할 때 어느 싸이트인지 알려 주는 숨은 칸 (이름·종류는 오류 때 다시 보여 주기용) -->
									<input type="hidden" th:field="*{rows[__${stat.index}__].id}">
									<input type="hidden" th:field="*{rows[__${stat.index}__].name}">
									<input type="hidden" th:field="*{rows[__${stat.index}__].typeName}">
									<strong th:text="${row.name}">01번 싸이트</strong>
								</td>
								<td class="fs-sm fg-3" th:text="${row.typeName}">캠핑사이트</td>
								<td>
								<td>
									<div class="d-flex align-items-center gap-2">
										<div class="switch">
											<!-- id를 직접 정함 (available-0, available-1 ...) → 아래 label과 연결 -->
											<input type="checkbox" role="switch" switch value="true"
												th:id="${'available-' + stat.index}"
												th:name="|rows[${stat.index}].available|" th:checked="${row.available}">
										</div>
										<!-- 체크를 끄면 체크박스 값이 아예 안 보내짐 →
											     이 숨은 칸(_로 시작)이 있으면 Spring이 false로 넣어 줌 -->
										<input type="hidden" th:name="|_rows[${stat.index}].available|" value="on">
										<label class="fs-sm" th:for="${'available-' + stat.index}">이용 가능</label>
									</div>
								</td>
								<td>
									<input type="text" class="form-control note-input" maxlength="200"
										th:field="*{rows[__${stat.index}__].note}"
										placeholder="예) 장박 이용 중 (2027년 3월까지)">
									<p class="field-error" th:if="${#fields.hasErrors('rows[__${stat.index}__].note')}"
										th:errors="*{rows[__${stat.index}__].note}">오류</p>
								</td>
							</tr>
						</tbody>
					</table>

					<div class="d-flex justify-content-end mt-5">
						<button type="submit" class="btn-solid theme-primary">전체 저장</button>
					</div>
				</form>
			</section>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="ko" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin :: head('로그인')}"></head>

<body>

	<main class="login-wrap">
		<div class="admin-card login-card">
			<p class="wordmark fg-1 mb-2" th:text="${settings['CAMP_NAME']}">잉글랜드 캠핑장</p>
			<h1 class="section-title fs-2xl mb-6">관리자 로그인</h1>

			<!-- 실패 이유 (SecurityConfig의 failureHandler가 ?error / ?locked 를 붙여 보냄) -->
			<div class="admin-flash is-error" role="alert" th:if="${param.error}">
				아이디 또는 비밀번호가 맞지 않습니다. 5번 틀리면 10분 동안 잠깁니다.
			</div>
			<div class="admin-flash is-error" role="alert" th:if="${param.locked}">
				로그인을 여러 번 틀려서 잠시 잠겼습니다. 10분 뒤에 다시 시도해 주세요.
			</div>

			<!-- 이름(username, password, remember-me)은 Spring Security가 정해 둔 것 -->
			<form th:action="@{/admin/login}" method="post" class="vstack gap-4">
				<div class="form-field">
					<label class="form-label" for="username">아이디</label>
					<input type="text" class="form-control" id="username" name="username" autocomplete="username"
						autofocus>
				</div>
				<div class="form-field">
					<label class="form-label" for="password">비밀번호</label>
					<input type="password" class="form-control" id="password" name="password"
						autocomplete="current-password">
				</div>
				<div class="form-field">
					<div class="switch"><input type="checkbox" id="rememberMe" name="remember-me" role="switch" switch>
					</div>
					<label for="rememberMe">로그인 유지 (2주)</label>
				</div>
				<button type="submit" class="btn-solid theme-primary btn-lg">로그인</button>
			</form>

			<p class="fs-xs fg-3 mt-5 mb-4">여러 사람이 쓰는 컴퓨터에서는 로그인 유지를 켜지 마세요.</p>
			<a class="fs-sm" th:href="@{/}">← 홈페이지로</a>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>

<!DOCTYPE html>
<html lang="ko" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin :: head('비밀번호 변경')}"></head>

<body>

	<header th:replace="~{fragments/admin :: header}"></header>

	<main class="admin-main">
		<div class="container">
			<div th:replace="~{fragments/admin :: flash}"></div>

			<section class="admin-card" style="max-width:32rem">
				<h1 class="fs-xl fw-semibold mb-5">비밀번호 변경</h1>

				<!-- 비밀번호는 실패해도 다시 채워 넣지 않음 (그래서 th:field 대신 name만) -->
				<form th:action="@{/admin/password}" method="post" class="vstack gap-4" novalidate>
					<div class="form-field">
						<label class="form-label" for="currentPassword">현재 비밀번호</label>
						<input type="password" class="form-control" id="currentPassword" name="currentPassword"
							autocomplete="current-password">
					</div>
					<div class="form-field">
						<label class="form-label" for="newPassword">새 비밀번호 (8자 이상)</label>
						<input type="password" class="form-control" id="newPassword" name="newPassword"
							autocomplete="new-password">
					</div>
					<div class="form-field">
						<label class="form-label" for="newPasswordConfirm">새 비밀번호 확인</label>
						<input type="password" class="form-control" id="newPasswordConfirm" name="newPasswordConfirm"
							autocomplete="new-password">
					</div>
					<p class="fs-xs fg-3 mb-0">비밀번호를 바꾸면 다른 기기에 켜 둔 "로그인 유지"는 풀립니다.</p>
					<div><button type="submit" class="btn-solid theme-primary">변경</button></div>
				</form>
			</section>
		</div>
	</main>

	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>

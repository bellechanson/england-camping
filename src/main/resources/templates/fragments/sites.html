<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  사이트 배치도 조각 (메인, 사이트·요금 페이지에서 같이 씀) — 건축 배치도처럼 절제된 스타일
  - 캠핑장 안내도를 보고 직접 그린 그림. 사이트를 옮기거나 늘리면 동그라미 좌표(cx, cy)를 고쳐야 함
  - 왼쪽부터 캠핑장 → 입구(E와 F 사이) → 도로 → 계곡
  - 동그라미 색 = 예약처 (관리자 > 사이트 관리 > 예약처): 네이버·캠핏 초록 / 땡큐캠핑 주황 / 전화 문의 흰 바탕
  - 이용 불가 사이트(오늘이 불가 기간인 사이트)는 예약처와 상관없이 점선 동그라미 + 회색 번호
  - 왼쪽 위 빈자리에 색 설명(범례). 전화 문의 줄은 그런 사이트가 있을 때만 나옴
  - 쓰는 쪽 화면에 ${sites} (사이트 목록)가 있어야 함
  - 색·굵기는 england.css 의 .site-map 부분에서 바꿈
-->

<body>

	<!-- 사이트 모양(색·점선)은 사이트마다 CampSite.getMapClass 로 정함 (아래 사이트 부분) -->
	<svg th:fragment="map" class="site-map" viewBox="0 0 560 565" role="img" aria-label="잉글랜드 캠핑장 사이트 배치도">

		<!-- 계곡 (맨 오른쪽) -->
		<path class="map-water" d="M 562 0 C 548 120 538 250 540 390 L 540 565" />

		<!-- 도로 (계곡과 캠핑장 사이): 연한 띠 + 양쪽 가는 선 -->
		<path class="map-road" d="M 522 0 C 512 120 503 250 505 390 L 507 565" />
		<path class="map-road-edge" d="M 514 0 C 504 120 495 250 497 390 L 499 565" />
		<path class="map-road-edge" d="M 530 0 C 520 120 511 250 513 390 L 515 565" />

		<!-- 캠핑장 땅 (채우기만) + 경계선 (입구 자리는 끊김) -->
		<path class="map-ground"
			d="M 5 245 L 230 68 L 345 15 L 440 120 L 480 140 L 475 395 L 482 450 L 490 555 L 90 545 L 40 420 Z" />
		<path class="map-fence"
			d="M 476 365 L 480 140 L 440 120 L 345 15 L 230 68 L 5 245 L 40 420 L 90 545 L 490 555 L 482 450 L 475 395" />

		<!-- 입구 길: 도로 → E와 F 사이 → 캠핑장 안쪽 -->
		<path class="map-lane" d="M 500 380 L 470 380 C 430 380 400 377 352 378" />
		<text class="map-label" x="452" y="402">입구</text>

		<!-- 건물 -->
		<rect class="map-bldg" x="180" y="306" width="50" height="30" rx="2" />
		<text class="map-label" x="205" y="354">관리동 · 매점</text>
		<rect class="map-bldg" x="96" y="390" width="32" height="22" rx="2" />
		<text class="map-label" x="112" y="430">주택</text>

		<!-- 도로·계곡 이름 (오른쪽 위, 가는 안내선으로 가리킴) -->
		<line class="map-pointer" x1="496" y1="44" x2="516" y2="44" />
		<text class="map-label is-end" x="492" y="44" dy=".35em">도로</text>
		<line class="map-pointer is-water" x1="496" y1="66" x2="548" y2="66" />
		<text class="map-label is-end is-water" x="492" y="66" dy=".35em">계곡</text>

		<!-- 북쪽 표시 -->
		<g class="map-north" transform="translate(26 508)">
			<path d="M0 -10 L5 6 L0 3 L-5 6 Z" />
			<text class="map-label" y="20">N</text>
		</g>

		<!-- 색 설명 (왼쪽 위 빈자리) -->
		<g class="map-legend">
			<circle class="is-naver" cx="18" cy="20" r="6" /><text x="30" y="20" dy=".35em">네이버·캠핏 예약</text>
			<circle class="is-thankq" cx="18" cy="40" r="6" /><text x="30" y="40" dy=".35em">땡큐캠핑 예약</text>
			<circle class="is-closed" cx="18" cy="60" r="6" /><text x="30" y="60" dy=".35em">지금 이용 불가</text>
			<!-- 누르면 사진 창이 열린다는 안내 (아래 popup 조각) -->
			<text class="map-hint" x="12" y="104" dy=".35em">번호를 누르면 사진이 보여요</text>
			<!-- 전화 문의 사이트가 있을 때만 -->
			<g th:if="${!#lists.isEmpty(sites.?[reserveChannel.name() == 'PHONE'])}">
				<circle class="is-phone" cx="18" cy="80" r="6" /><text x="30" y="80" dy=".35em">전화 문의</text>
			</g>
		</g>

		<!-- 사이트 (동그라미 가운데 = 위치)
		     site = 이 번호의 사이트, 모양은 CampSite.getMapClass:
		     지금 불가 = is-closed(점선 + 회색) / 땡큐캠핑 = is-thankq(주황) / 전화 문의 = is-phone(흰 바탕) / 네이버·캠핏 = 기본(초록) -->
		<g class="map-site" th:with="site=${sites.^[shortName == '01']}" th:classappend="${site?.mapClass}">
			<circle cx="65" cy="330" r="14" /><text x="65" y="330" dy=".36em">01</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '02']}" th:classappend="${site?.mapClass}">
			<circle cx="65" cy="280" r="14" /><text x="65" y="280" dy=".36em">02</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '03']}" th:classappend="${site?.mapClass}">
			<circle cx="85" cy="235" r="14" /><text x="85" y="235" dy=".36em">03</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '04']}" th:classappend="${site?.mapClass}">
			<circle cx="120" cy="202" r="14" /><text x="120" y="202" dy=".36em">04</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '05']}" th:classappend="${site?.mapClass}">
			<circle cx="150" cy="175" r="14" /><text x="150" y="175" dy=".36em">05</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '06']}" th:classappend="${site?.mapClass}">
			<circle cx="185" cy="150" r="14" /><text x="185" y="150" dy=".36em">06</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '07']}" th:classappend="${site?.mapClass}">
			<circle cx="225" cy="130" r="14" /><text x="225" y="130" dy=".36em">07</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '08']}" th:classappend="${site?.mapClass}">
			<circle cx="258" cy="108" r="14" /><text x="258" y="108" dy=".36em">08</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '09']}" th:classappend="${site?.mapClass}">
			<circle cx="290" cy="87" r="14" /><text x="290" y="87" dy=".36em">09</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '10']}" th:classappend="${site?.mapClass}">
			<circle cx="330" cy="52" r="14" /><text x="330" y="52" dy=".36em">10</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '11']}" th:classappend="${site?.mapClass}">
			<circle cx="370" cy="87" r="14" /><text x="370" y="87" dy=".36em">11</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '12']}" th:classappend="${site?.mapClass}">
			<circle cx="397" cy="128" r="14" /><text x="397" y="128" dy=".36em">12</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '13']}" th:classappend="${site?.mapClass}">
			<circle cx="282" cy="195" r="14" /><text x="282" y="195" dy=".36em">13</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == '14']}" th:classappend="${site?.mapClass}">
			<circle cx="318" cy="225" r="14" /><text x="318" y="225" dy=".36em">14</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == 'A']}" th:classappend="${site?.mapClass}">
			<circle cx="437" cy="165" r="14" /><text x="437" y="165" dy=".36em">A</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == 'B']}" th:classappend="${site?.mapClass}">
			<circle cx="427" cy="210" r="14" /><text x="427" y="210" dy=".36em">B</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == 'C']}" th:classappend="${site?.mapClass}">
			<circle cx="420" cy="250" r="14" /><text x="420" y="250" dy=".36em">C</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == 'D']}" th:classappend="${site?.mapClass}">
			<circle cx="417" cy="295" r="14" /><text x="417" y="295" dy=".36em">D</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == 'E']}" th:classappend="${site?.mapClass}">
			<circle cx="415" cy="340" r="14" /><text x="415" y="340" dy=".36em">E</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == 'F']}" th:classappend="${site?.mapClass}">
			<circle cx="325" cy="410" r="14" /><text x="325" y="410" dy=".36em">F</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == 'G']}" th:classappend="${site?.mapClass}">
			<circle cx="295" cy="448" r="14" /><text x="295" y="448" dy=".36em">G</text>
		</g>
		<g class="map-site" th:with="site=${sites.^[shortName == 'H']}" th:classappend="${site?.mapClass}">
			<circle cx="263" cy="477" r="14" /><text x="263" y="477" dy=".36em">H</text>
		</g>
	</svg>

	<!-- ===== 손님용 "사이트 이용 안내" 목록 (메인·사이트 페이지 요금표 아래) =====
	     쓰는 쪽 화면에 ${siteNotices}(SiteGuideService.findStatusNotices)와 ${sites}가 있어야 함
	     번호 동그라미는 배치도와 같은 모양: 지금 불가 = 점선 + 줄, 예정 = 주황 실선 -->
	<div th:fragment="statusList" class="site-status">
		<p class="site-status-title">사이트 이용 안내</p>

		<ul class="site-status-list" th:if="${!#lists.isEmpty(siteNotices)}">
			<li th:each="n : ${siteNotices}">
				<span class="site-status-num" th:classappend="${n.closedNow} ? 'is-closed'"
					th:text="${n.shortName}">07</span>
				<span><span th:text="${n.text}">11월 26일까지 이용 불가</span>
					<span class="site-status-flag" th:unless="${n.closedNow}">예정</span></span>
			</li>
		</ul>

		<!-- 막힌 사이트가 하나도 없을 때 -->
		<p class="site-status-ok" th:if="${#lists.isEmpty(siteNotices)}">
			<span class="site-status-num is-ok" aria-hidden="true">✓</span>
			<span th:text="'지금은 ' + ${#lists.size(sites)} + '개 사이트 모두 이용할 수 있어요'">지금은 22개 사이트 모두 이용할 수
				있어요</span>
		</p>

		<p class="site-status-note" th:if="${!#lists.isEmpty(siteNotices)}">배치도에서 점선으로 표시된 사이트는 지금 이용할 수 없습니다.</p>
	</div>
	<!-- ===== 손님용 사이트 사진 창 (배치도 동그라미를 누르면 열림, 11-26) =====
	     쓰는 쪽 화면에 ${sites}, ${siteNotices}, ${reserveLinks}, ${settings} 가 있어야 함 (메인, 사이트·요금 페이지)
	     - 사이트 정보는 아래 숨은 목록(#siteData, #siteNoticeData)에 넣어 두고, 스크립트가 누른 번호로 찾아서 창에 채움
	     - 예약 로고: 네이버·캠핏 사이트 = 네이버·캠핏 로고 / 땡큐캠핑 사이트 = 땡큐캠핑 로고 / 전화 문의 사이트 = 전화 버튼만
	       (로고 이름은 GlobalModelAdvice.reserveLinks 의 "땡큐캠핑"으로 나눔)
	     - 지금 이용 불가인 사이트는 예약 로고를 숨기고 안내 문구 + 전화 버튼만
	     - 사진은 관리자 > 사이트 사진에서 올림. 없으면 "사진 준비 중" -->
	<th:block th:fragment="popup">
		<dialog class="dialog dialog-lg site-popup" id="sitePopup" aria-labelledby="sitePopupTitle">
			<div class="dialog-header">
				<h5 class="dialog-title" id="sitePopupTitle">사이트</h5>
				<button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="닫기"></button>
			</div>
			<div class="dialog-body">
				<div class="ph ph-4x3 rounded-3 site-popup-photo">
					<img id="sitePopupImg" alt="" hidden>
					<span class="ph-label" id="sitePopupEmpty">사진 준비 중</span>
				</div>
				<p class="site-popup-notice" id="sitePopupNotice" hidden></p>
				<p class="site-popup-channel" id="sitePopupChannel"></p>
				<div class="site-popup-actions">
					<!-- 네이버·캠핏 사이트일 때 -->
					<div class="reserve-logos" data-channel="NAVER_CAMFIT" hidden>
						<a th:each="link : ${reserveLinks}" th:if="${link.name != '땡큐캠핑'}" class="reserve-logo"
							th:href="${link.url}" target="_blank" rel="noopener"
							th:title="${link.name} + ' 바로가기 (새 창)'">
							<img th:if="${link.icon != null}" th:src="@{${link.icon}}" alt="" width="44" height="44">
							<span th:text="${link.name}">네이버 예약</span>
						</a>
					</div>
					<!-- 땡큐캠핑 사이트일 때 -->
					<div class="reserve-logos" data-channel="THANKQ" hidden>
						<a th:each="link : ${reserveLinks}" th:if="${link.name == '땡큐캠핑'}" class="reserve-logo"
							th:href="${link.url}" target="_blank" rel="noopener"
							th:title="${link.name} + ' 바로가기 (새 창)'">
							<img th:if="${link.icon != null}" th:src="@{${link.icon}}" alt="" width="44" height="44">
							<span th:text="${link.name}">땡큐캠핑</span>
						</a>
					</div>
					<!-- 전화는 늘 보임 -->
					<a class="btn-outline theme-secondary btn-sm" th:href="'tel:' + ${settings['PHONE']}"
						th:text="'전화 문의 ' + ${settings['PHONE']}">전화 문의</a>
				</div>
			</div>
		</dialog>

		<!-- 스크립트가 창을 열 때 누르는 숨은 버튼 (갤러리 창과 같은 방식으로 열려고) -->
		<button type="button" id="sitePopupOpen" data-bs-toggle="dialog" data-bs-target="#sitePopup" hidden></button>

		<!-- 사이트 정보 (화면에는 안 보임) -->
		<ul id="siteData" hidden>
			<li th:each="s : ${sites}"
				th:attr="data-short=${s.shortName}, data-name=${s.name}, data-photo=${s.hasPhoto()} ? @{${s.photoUrl}} : '', data-channel=${s.reserveChannel.name()}, data-label=${s.reserveChannel.label}, data-open=${s.openNow}">
			</li>
		</ul>
		<ul id="siteNoticeData" hidden>
			<li th:each="n : ${siteNotices}" th:attr="data-short=${n.shortName}, data-text=${n.text}"></li>
		</ul>

		<script>
			(() => {
				const popup = document.getElementById('sitePopup');
				if (!popup) {
					return;
				}
				const opener = document.getElementById('sitePopupOpen');
				const title = document.getElementById('sitePopupTitle');
				const img = document.getElementById('sitePopupImg');
				const empty = document.getElementById('sitePopupEmpty');
				const notice = document.getElementById('sitePopupNotice');
				const channel = document.getElementById('sitePopupChannel');
				const logoGroups = popup.querySelectorAll('.reserve-logos[data-channel]');

				// 짧은 이름("01", "A") → 사이트 정보 / 이용 안내 문구
				const sites = {};
				document.querySelectorAll('#siteData li').forEach((li) => {sites[li.dataset.short] = li.dataset;});
				const notices = {};
				document.querySelectorAll('#siteNoticeData li').forEach((li) => {notices[li.dataset.short] = li.dataset.text;});

				// 창에 채우고 열기 (글자는 textContent 로만 넣음)
				function show(shortName) {
					const s = sites[shortName];
					if (!s) {
						return;
					}
					const isOpen = s.open === 'true';
					title.textContent = s.name;

					if (s.photo) {
						img.src = s.photo;
						img.alt = s.name + ' 사진';
						img.hidden = false;
						empty.hidden = true;
					} else {
						img.removeAttribute('src');
						img.hidden = true;
						empty.hidden = false;
					}

					const text = notices[shortName];
					notice.textContent = text || '';
					notice.hidden = !text;
					notice.classList.toggle('is-closed', !isOpen);

					if (!isOpen) {
						channel.textContent = '지금은 예약할 수 없는 사이트예요. 궁금한 점은 전화로 문의해 주세요.';
					} else if (s.channel === 'PHONE') {
						channel.textContent = '이 사이트는 전화로 문의해 주세요.';
					} else {
						channel.textContent = '이 사이트는 ' + s.label + '에서 예약할 수 있어요.';
					}
					logoGroups.forEach((g) => {g.hidden = !isOpen || g.dataset.channel !== s.channel;});

					opener.click();
				}

				// 배치도 동그라미마다: 누르면(또는 Enter) 창 열기
				document.querySelectorAll('.site-map .map-site').forEach((g) => {
					const shortName = (g.querySelector('text')?.textContent || '').trim();
					if (!sites[shortName]) {
						return;
					}
					g.setAttribute('role', 'button');
					g.setAttribute('tabindex', '0');
					g.setAttribute('aria-label', sites[shortName].name + ' 사진 보기');
					g.addEventListener('click', () => show(shortName));
					g.addEventListener('keydown', (e) => {
						if (e.key === 'Enter' || e.key === ' ') {
							e.preventDefault();
							show(shortName);
						}
					});
				});
			})();
		</script>
	</th:block>
</body>

</html>

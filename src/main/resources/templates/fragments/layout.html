<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  모든 페이지 공통 조각 모음
  - head(pageTitle) : <head> 전체 (CSS, 글꼴, 페이지 제목)
  - header          : 위쪽 메뉴
  - footer          : 아래쪽 꼬리말
  - scripts         : 맨 아래 자바스크립트
-->

<!-- ===== 1. head ===== -->

<head th:fragment="head(pageTitle)">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${pageTitle}">잉글랜드 캠핑장</title>
	<meta name="description" th:content="${settings['HERO_SUBTITLE']}">


	<!-- 검색·카톡 미리보기 (링크를 보내면 사진+제목+설명 카드가 뜸)
	     사진은 관리자 > 사진 관리에서 "메인 큰 사진"으로 지정한 것. 없으면 글만 나옴 -->
	<link rel="canonical" th:href="${currentUrl}">
	<meta property="og:type" content="website">
	<meta property="og:locale" content="ko_KR">
	<meta property="og:site_name" th:content="${settings['CAMP_NAME']}">
	<meta property="og:title" th:content="${pageTitle}">
	<meta property="og:description" th:content="${settings['HERO_SUBTITLE']}">
	<meta property="og:url" th:content="${currentUrl}">
	<meta property="og:image" th:if="${slotPhotos['HERO'] != null}" th:content="${baseUrl + slotPhotos['HERO'].url}">
	<meta name="twitter:card" content="summary_large_image">

	<!-- 한글 제목 글꼴 (Google Fonts). 막혀 있으면 기본 글꼴로 보임 -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap">

	<!-- Bootstrap 6 (템플릿에 들어 있던 파일 그대로) -->
	<link rel="stylesheet" th:href="@{/assets/vendor/bootstrap6/css/bootstrap.min.css}">
	<script type="importmap">{"imports": {"bootstrap": "/assets/vendor/bootstrap6/js/bootstrap.bundle.min.js"}}</script>

	<!-- 템플릿 CSS → 우리 CSS 순서 (뒤에 오는 우리 것이 이김) -->
	<link rel="stylesheet" th:href="@{/assets/css/base.css}">
	<link rel="stylesheet" th:href="@{/assets/css/style.css}">
	<link rel="stylesheet" th:href="@{/assets/css/england.css}">
</head>

<!-- ===== 2. 머리글 (메뉴) ===== -->
<header th:fragment="header" class="site-header">
	<!-- 띠 공지: 관리자가 켜 두면 모든 손님 페이지 맨 위에 보임 -->
	<div class="site-banner" role="status" th:if="${banner != null}">
		<span th:text="${banner}">띠 공지 내용</span>
		<a th:href="@{/notice}">공지 보기</a>
	</div>
	<nav class="navbar lg:navbar-expand" aria-label="주 메뉴">
		<div class="container-fluid px-5 lg:px-6">
			<a class="wordmark" th:href="@{/}" th:text="${settings['CAMP_NAME']}">잉글랜드 캠핑장</a>

			<!-- PC에서는 가로 메뉴, 좁은 화면에서는 오른쪽에서 나오는 서랍 메뉴 -->
			<dialog class="drawer drawer-end" tabindex="-1" id="navDrawer" aria-labelledby="navDrawerLabel">
				<div class="drawer-header">
					<h5 class="drawer-title" id="navDrawerLabel">메뉴</h5>
					<button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="닫기"></button>
				</div>
				<div class="drawer-body mb-3 lg:mb-0">
					<ul class="nav navbar-nav ms-auto lg:gap-4">
						<li class="nav-item"><a class="nav-link" th:href="@{/about}">캠핑장 소개</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/sites}">사이트 및 이용요금</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/guide}">이용안내</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/location}">오시는 길</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/notice}">공지사항</a></li>
						<li class="nav-item"><a class="nav-link" th:href="@{/gallery}">갤러리</a></li>
					</ul>
					<!-- 폰 서랍 메뉴 아래: 예약처 버튼 + 전화 (넓은 화면에서는 CSS로 숨김)
					     예약처는 새 창이라 서랍이 열려 있어도 문제없음 -->
					<div class="drawer-actions">
						<p class="drawer-actions-label">예약하기</p>
						<a th:each="link : ${reserveLinks}" class="btn-solid theme-primary" th:href="${link.url}"
							th:text="${link.name}" target="_blank" rel="noopener">예약처</a>
						<a class="btn-outline theme-secondary" th:href="'tel:' + ${settings['PHONE']}"
							th:text="'전화 문의 ' + ${settings['PHONE']}">전화 문의</a>
					</div>
				</div>
			</dialog>

			<div class="d-flex align-items-center gap-3 ms-auto">
				<!-- 어느 페이지에서든 메인의 예약 바로 이동 -->
				<a class="btn-solid theme-primary btn-sm header-book-btn" href="/#book">예약하기</a>
				<!-- 다크모드 버튼은 쓰지 않기로 해서 뺌 -->
				<button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
					data-bs-target="#navDrawer" aria-controls="navDrawer" aria-label="메뉴 열기">
					<span class="navbar-toggler-icon" aria-hidden="true"></span>
				</button>
			</div>
		</div>
	</nav>
</header>

<!-- ===== 2-1. 하위 페이지 제목 띠 =====
     subhead(작은 제목, 큰 제목, 설명) — 설명이 없으면 null -->
<div th:fragment="subhead(eyebrow, title, lead)" class="sub-head">
	<div class="container">
		<nav aria-label="현재 위치" class="mb-5">
			<ol class="breadcrumb mb-0">
				<li class="breadcrumb-item"><a class="breadcrumb-link" th:href="@{/}">홈</a></li>
				<li class="breadcrumb-item active" aria-current="page" th:text="${eyebrow}">페이지</li>
			</ol>
		</nav>
		<p class="eyebrow fs-sm fg-primary mb-3" th:text="${eyebrow}">작은 제목</p>
		<h1 class="section-title fs-5xl mb-4" th:text="${title}">큰 제목</h1>
		<p class="fs-lg fg-2 mb-0" style="max-width:40rem" th:if="${lead != null}" th:text="${lead}">설명</p>
	</div>
</div>

<!-- ===== 3. 꼬리말 ===== -->
<footer th:fragment="footer" class="site-footer section pb-6">
	<!-- 관리자로 로그인한 상태에서만 보이는 바로가기 (왼쪽 아래 떠 있음, 손님에게는 안 보임) -->
	<div class="admin-quickbar" th:if="${adminLoggedIn}">
		<span>관리자로 보는 중</span>
		<a th:href="@{/admin}">관리자 화면</a>
		<form th:action="@{/admin/logout}" method="post">
			<button type="submit">로그아웃</button>
		</form>
	</div>
	<div class="container">
		<div class="row g-6">
			<div class="md:col-4">
				<p class="wordmark fg-1 d-inline-block mb-4" th:text="${settings['CAMP_NAME']}">잉글랜드 캠핑장</p>
				<p class="fg-3 fs-sm mb-0">
					<span th:text="${settings['ADDRESS_ROAD']}">주소</span><br>
					<span th:text="'(우) ' + ${settings['ZIP_CODE']}">우편번호</span>
				</p>
			</div>
			<div class="col-6 md:col-2">
				<p class="fw-semibold fs-sm mb-4">안내</p>
				<ul class="list-unstyled fs-sm fg-3 mb-0">
					<li class="mb-3"><a th:href="@{/about}">캠핑장 소개</a></li>
					<li class="mb-3"><a th:href="@{/sites}">사이트 및 이용요금</a></li>
					<li class="mb-3"><a th:href="@{/guide}">이용안내</a></li>
				</ul>
			</div>
			<div class="col-6 md:col-2">
				<p class="fw-semibold fs-sm mb-4">소식</p>
				<ul class="list-unstyled fs-sm fg-3 mb-0">
					<li class="mb-3"><a th:href="@{/notice}">공지사항</a></li>
					<li class="mb-3"><a th:href="@{/gallery}">갤러리</a></li>
					<li class="mb-3"><a th:href="@{/location}">오시는 길</a></li>
				</ul>
			</div>
			<div class="md:col-4">
				<p class="fw-semibold fs-sm mb-4">문의</p>
				<p class="fs-sm fg-3 mb-1"><a th:href="'tel:' + ${settings['PHONE']}"
						th:text="${settings['PHONE']}">전화번호</a></p>
				<p class="fs-xs fg-3 mb-0"
					th:text="'체크인 ' + ${settings['CHECK_IN']} + ' · 체크아웃 ' + ${settings['CHECK_OUT']}">체크인 · 체크아웃</p>
			</div>
		</div>
		<hr class="my-6">
		<p class="fs-xs fg-3 mb-0">&copy; <span data-year></span> <span th:text="${settings['CAMP_NAME']}">잉글랜드
				캠핑장</span></p>
	</div>
</footer>

<!-- ===== 4. 스크립트 (템플릿 main.js 그대로) ===== -->
<th:block th:fragment="scripts">
	<script type="module" th:src="@{/assets/js/main.js}"></script>
	<!-- 서랍 아래 예약처·전화 버튼: 좁은 화면(서랍 메뉴)에서만 보이게
	     넓은 화면에서는 템플릿 CSS가 이 영역을 강하게 정해서 CSS로 숨길 수 없음
	     → 요소에 직접 display를 적음 (요소에 직접 쓴 !important는 어떤 CSS 파일보다 우선)
	     기준 992px = 템플릿이 가로 메뉴로 바꾸는 폭과 같음 -->
	<script>
		(() => {
			const actions = document.querySelector('#navDrawer .drawer-actions');
			if (!actions) {
				return; // 관리자 화면 등 서랍이 없는 페이지
			}
			const narrow = window.matchMedia('(max-width: 991.98px)');
			const apply = () => actions.style.setProperty('display', narrow.matches ? 'flex' : 'none', 'important');
			apply();
			narrow.addEventListener('change', apply); // 창 크기를 바꿀 때도 다시 맞춤
		})();
	</script>
	<!-- [사진] [배치도] 같은 탭 바꾸기 (메인, 사이트·요금 페이지)
	     data-media-tabs 안의 role="tab" 버튼을 누르면 aria-controls 로 연결된 칸만 보임 -->
	<script>
		document.querySelectorAll('[data-media-tabs]').forEach(function (box) {
			const tabs = box.querySelectorAll('[role="tab"]');
			tabs.forEach(function (tab) {
				tab.addEventListener('click', function () {
					tabs.forEach(function (t) {
						const on = (t === tab);
						t.classList.toggle('is-active', on);
						t.setAttribute('aria-selected', on ? 'true' : 'false');
						document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
					});
				});
			});
		});
	</script>
</th:block>

</html>

<!DOCTYPE html>
<html lang="ko" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${'사이트 및 이용요금 | ' + settings['CAMP_NAME']})}"></head>

<body class="sub-head-page">

	<a class="visually-hidden-focusable btn-solid theme-primary m-3" href="#main">본문 바로가기</a>
	<header th:replace="~{fragments/layout :: header}"></header>

	<div
		th:replace="~{fragments/layout :: subhead('사이트 및 이용요금', '사이트 및 이용요금 안내', ${'요금은 1박 기준입니다. ' + settings['PEAK_SEASON_INFO']})}">
	</div>

	<main id="main">

		<!-- ===== 사이트 종류별 요금 (종류가 늘어나면 자동으로 여러 개) ===== -->
		<section class="section">
			<div class="container">
				<div class="row g-7 mb-7" th:each="type : ${types}">
					<!-- 왼쪽: [사진] [배치도] 탭 (메인과 같은 모양, 탭 id 에 종류 번호를 붙여서 겹치지 않게) -->
					<div class="lg:col-6">
						<div class="media-tabs" data-media-tabs>
							<div class="media-tab-list" role="tablist" aria-label="사이트 사진과 배치도">
								<button type="button" class="media-tab is-active" role="tab" aria-selected="true"
									th:id="'typeTabPhoto' + ${type.id}"
									th:attr="aria-controls=${'typePanelPhoto' + type.id}">사진</button>
								<button type="button" class="media-tab" role="tab" aria-selected="false"
									th:id="'typeTabMap' + ${type.id}"
									th:attr="aria-controls=${'typePanelMap' + type.id}">배치도</button>
							</div>
							<div class="room-media mb-0">
								<!-- 탭 1: 사이트 대표 사진 (관리자 > 사진 관리 > 자리에 넣기) -->
								<div role="tabpanel" th:id="'typePanelPhoto' + ${type.id}"
									th:attr="aria-labelledby=${'typeTabPhoto' + type.id}">
									<div class="ph" th:with="p=${slotPhotos['SITE']}">
										<img th:if="${p != null}" th:src="@{${p.url}}"
											th:alt="${p.caption ?: type.name + ' 사진'}" loading="lazy">
										<span class="ph-label" th:if="${p == null}"
											th:text="${type.name} + ' 사진'">사진</span>
									</div>
								</div>
								<!-- 탭 2: 배치도 (처음엔 숨김, 이용 불가는 점선) -->
								<div role="tabpanel" hidden th:id="'typePanelMap' + ${type.id}"
									th:attr="aria-labelledby=${'typeTabMap' + type.id}">
									<div class="site-map-box">
										<svg th:replace="~{fragments/sites :: map}"></svg>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 오른쪽: 요금표 -->
					<div class="lg:col-6">
						<p class="eyebrow fs-sm fg-primary mb-3" th:text="${type.floorType}">파쇄석</p>
						<h2 class="section-title fs-3xl mb-5" th:text="${type.name}">캠핑사이트</h2>

						<div class="spec-row"><span class="fg-3 fs-sm">크기</span><span class="fs-sm"
								th:text="${type.sizeText}">8m x 10m</span></div>
						<div class="spec-row"><span class="fg-3 fs-sm">기준 인원</span>
							<span class="fs-sm"
								th:text="'성인 ' + ${type.baseGuests} + '명 + 소인 ' + ${type.baseChildren} + '명'">성인 2명 + 소인
								2명</span>
						</div>
						<div class="spec-row"><span class="fg-3 fs-sm">성인 최대</span>
							<span class="fs-sm" th:text="${type.maxGuests} + '명'">3명</span>
						</div>
						<div class="spec-row"><span class="fg-3 fs-sm">최소 숙박</span><span class="fs-sm"
								th:text="${type.minNights} + '박'">1박</span></div>
						<div class="spec-row"><span class="fg-3 fs-sm">평소 1박</span>
							<span class="fs-sm fw-semibold"
								th:text="${type.normalPrice != null} ? ${#numbers.formatInteger(type.normalPrice, 1, 'COMMA')} + '원' : '전화 문의'">50,000원</span>
						</div>
						<div class="spec-row"><span class="fg-3 fs-sm">성수기(연휴) 1박</span>
							<span class="fs-sm fw-semibold"
								th:text="${type.peakPrice != null} ? ${#numbers.formatInteger(type.peakPrice, 1, 'COMMA')} + '원' : '전화 문의'">60,000원</span>
						</div>
						<div class="spec-row"><span class="fg-3 fs-sm">성인 추가 1인</span>
							<span class="fs-sm"
								th:text="${type.extraPersonFee != null} ? ${#numbers.formatInteger(type.extraPersonFee, 1, 'COMMA')} + '원' : '전화 문의'">10,000원</span>
						</div>
						<div class="spec-row"><span class="fg-3 fs-sm">사이트</span>
							<span class="fs-sm" th:text="'전체 ' + ${#lists.size(sites)} + '개'">전체 22개</span>
						</div>

						<p class="fs-sm fg-3 mt-5 mb-2" th:text="${settings['EXTRA_PERSON_INFO']}">16세 이하 무료</p>
						<p class="fs-xs fg-3 mb-0">배치도에서 점선으로 표시된 사이트는 현재 이용할 수 없습니다.</p>
					</div>
				</div>
			</div>
		</section>

		<!-- ===== 장박 + 예약 ===== -->
		<section class="section bg-2">
			<div class="container">
				<div class="row g-5">
					<div class="md:col-6">
						<div class="offer">
							<p class="offer-flag mb-4">장박</p>
							<h3 class="fs-xl fw-semibold mb-3">전화 상담 후 결정</h3>
							<p class="fg-2 fs-sm mb-5" th:text="${settings['LONG_STAY_INFO']}">장박 안내</p>
							<p class="fs-sm mb-0"><a th:href="'tel:' + ${settings['PHONE']}"
									th:text="${settings['PHONE']}">전화번호</a></p>
						</div>
					</div>
					<div class="md:col-6">
						<div class="offer">
							<p class="offer-flag mb-4">예약</p>
							<h3 class="fs-xl fw-semibold mb-3">예약은 아래에서 받습니다</h3>
							<div class="reserve-buttons mb-5">
								<a th:each="link : ${reserveLinks}" class="btn-solid theme-primary"
									th:href="${link.url}" th:text="${link.name}" target="_blank" rel="noopener">예약처</a>
							</div>
							<p class="fs-sm fg-3 mb-0">빈 사이트와 날짜는 각 예약처에서 확인해 주세요.</p>
						</div>
					</div>
				</div>
			</div>
		</section>

	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>

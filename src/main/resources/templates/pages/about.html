<!DOCTYPE html>
<html lang="ko" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${'캠핑장 소개 | ' + settings['CAMP_NAME']})}"></head>
<!-- sub-head-page: 머리글 글자를 진한 색으로 (밝은 배경용) -->

<body class="sub-head-page">

	<a class="visually-hidden-focusable btn-solid theme-primary m-3" href="#main">본문 바로가기</a>
	<header th:replace="~{fragments/layout :: header}"></header>

	<div th:replace="~{fragments/layout :: subhead('캠핑장 소개', '캠지기 부부가 직접 만든 캠핑장', ${settings['INTRO_TITLE']})}"></div>

	<main id="main">
		<section class="section">
			<div class="container">
				<!-- align-items-center: 글과 사진 묶음을 세로 가운데 맞춤 -->
				<div class="row g-7 align-items-center">
					<!-- 소개 본문 전체 (관리자 화면에서 수정) -->
					<div class="lg:col-6">
						<p class="fg-2 fs-lg mb-5" th:each="paragraph : ${introParagraphs}" th:text="${paragraph}">소개 문단
						</p>
						<!-- 예약하기: 머리글 예약하기와 같은 투명 주황 알약 (header-book-btn 재사용)
						     옆 링크: 밑줄 + 화살표 글자 링크 (england.css .arrow-link) -->
						<div class="d-flex flex-wrap align-items-center gap-5 mt-6">
							<a class="btn-solid theme-primary header-book-btn" href="/#reserve">예약하기</a>
							<a class="arrow-link" th:href="@{/sites}">사이트 및 이용요금 보기<span class="arrow"
									aria-hidden="true">→</span></a>
						</div>
					</div>
					<!-- 사진 3칸: 메인 소개 칸과 같은 배치
					     왼쪽 큰 세로 사진(3:4) + 오른쪽 작은 사진 2장 세로로 쌓기 → 글과 높이가 비슷해짐 -->
					<div class="lg:col-6">
						<div class="row g-4">
							<div class="col-7">
								<div class="ph ph-3x4 rounded-4" th:with="p=${slotPhotos['ABOUT_MAIN']}">
									<img th:if="${p != null}" th:src="@{${p.url}}" th:alt="${p.caption ?: '캠핑장 사진'}"
										loading="lazy">
									<span class="ph-label" th:if="${p == null}">캠핑장 사진</span>
								</div>
							</div>
							<div class="col-5">
								<div class="ph ph-1x1 rounded-4 mb-4" th:with="p=${slotPhotos['ABOUT_SUB1']}">
									<img th:if="${p != null}" th:src="@{${p.thumbUrl}}"
										th:alt="${p.caption ?: '캠핑장 사진'}" loading="lazy">
									<span class="ph-label" th:if="${p == null}">사진</span>
								</div>
								<div class="ph ph-1x1 rounded-4" th:with="p=${slotPhotos['ABOUT_SUB2']}">
									<img th:if="${p != null}" th:src="@{${p.thumbUrl}}"
										th:alt="${p.caption ?: '캠핑장 사진'}" loading="lazy">
									<span class="ph-label" th:if="${p == null}">사진</span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<footer th:replace="~{fragments/layout :: footer}"></footer>
	<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>

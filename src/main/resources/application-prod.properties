# ===== Production server (Lightsail) only =====
# Active only when /etc/england-camping/env has SPRING_PROFILES_ACTIVE=prod
# Overrides application.properties (no effect on local PC development)
# No passwords or keys here (they come from the server env file)

# App listens only inside the server; outside traffic must go through nginx (80/443)
server.address=127.0.0.1

# Behind nginx: use the real address (https://englandcamp.com)
# Without this, og:image and canonical URLs become http://localhost:8044
server.forward-headers-strategy=native

# Template cache on (faster; HTML is not edited on the server)
spring.thymeleaf.cache=true

# No SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server DB starts empty, so keep update for the first run (creates tables)
# Consider switching to validate once deployment is stable
spring.jpa.hibernate.ddl-auto=update

# Static files (CSS, JS, images): browser keeps them for 1 year
# Content versioning: Thymeleaf @{...} links get a hash (england-1a2b3c.css),
# so when a file changes, its URL changes and browsers download the new one
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true